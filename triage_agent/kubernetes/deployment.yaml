apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-triage-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-triage-agent
  template:
    metadata:
      labels:
        app: ai-triage-agent
    spec:
      containers:
        - name: api
          image: <ECR_REPO>:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: triage-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-triage-agent-svc
spec:
  type: ClusterIP
  selector:
    app: ai-triage-agent
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
