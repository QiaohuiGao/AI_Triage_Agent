<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Triage Agent | Emergency Severity Index</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            /* Core Palette - Medical Authority */
            --slate-950: #0a0f1a;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-300: #cbd5e1;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;

            /* ESI Level Colors */
            --esi-1: #dc2626;
            --esi-1-bg: #fef2f2;
            --esi-1-glow: rgba(220, 38, 38, 0.3);
            --esi-2: #ea580c;
            --esi-2-bg: #fff7ed;
            --esi-2-glow: rgba(234, 88, 12, 0.3);
            --esi-3: #ca8a04;
            --esi-3-bg: #fefce8;
            --esi-3-glow: rgba(202, 138, 4, 0.3);
            --esi-4: #16a34a;
            --esi-4-bg: #f0fdf4;
            --esi-4-glow: rgba(22, 163, 74, 0.3);
            --esi-5: #0d9488;
            --esi-5-bg: #f0fdfa;
            --esi-5-glow: rgba(13, 148, 136, 0.3);

            /* Accent */
            --accent: #3b82f6;
            --accent-light: #dbeafe;

            /* Semantic */
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;

            /* Typography */
            --font-display: 'Space Mono', monospace;
            --font-body: 'DM Sans', sans-serif;

            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            --space-3xl: 4rem;

            /* Radius */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-body);
            background: var(--slate-50);
            color: var(--slate-900);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, var(--slate-200) 1px, transparent 1px),
                linear-gradient(var(--slate-200) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
            pointer-events: none;
            z-index: -1;
        }

        #root {
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .animate-slide-in {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* Stagger children */
        .stagger-children > * {
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }
        .stagger-children > *:nth-child(1) { animation-delay: 0.1s; }
        .stagger-children > *:nth-child(2) { animation-delay: 0.2s; }
        .stagger-children > *:nth-child(3) { animation-delay: 0.3s; }
        .stagger-children > *:nth-child(4) { animation-delay: 0.4s; }
        .stagger-children > *:nth-child(5) { animation-delay: 0.5s; }
        .stagger-children > *:nth-child(6) { animation-delay: 0.6s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API Configuration
        const API_BASE = 'http://localhost:8000';

        // ESI Level Configuration
        const ESI_CONFIG = {
            1: {
                label: 'Resuscitation',
                color: 'var(--esi-1)',
                bg: 'var(--esi-1-bg)',
                glow: 'var(--esi-1-glow)',
                description: 'Immediate life-saving intervention required'
            },
            2: {
                label: 'Emergent',
                color: 'var(--esi-2)',
                bg: 'var(--esi-2-bg)',
                glow: 'var(--esi-2-glow)',
                description: 'High risk situation, should not wait'
            },
            3: {
                label: 'Urgent',
                color: 'var(--esi-3)',
                bg: 'var(--esi-3-bg)',
                glow: 'var(--esi-3-glow)',
                description: 'Requires 2+ resources, needs attention'
            },
            4: {
                label: 'Less Urgent',
                color: 'var(--esi-4)',
                bg: 'var(--esi-4-bg)',
                glow: 'var(--esi-4-glow)',
                description: 'Requires 1 resource'
            },
            5: {
                label: 'Non-urgent',
                color: 'var(--esi-5)',
                bg: 'var(--esi-5-bg)',
                glow: 'var(--esi-5-glow)',
                description: 'No resources needed, routine care'
            }
        };

        // Header Component
        function Header() {
            return (
                <header style={{
                    background: 'linear-gradient(135deg, var(--slate-900) 0%, var(--slate-800) 100%)',
                    color: 'white',
                    padding: 'var(--space-lg) var(--space-xl)',
                    position: 'sticky',
                    top: 0,
                    zIndex: 100,
                    boxShadow: 'var(--shadow-lg)'
                }}>
                    <div style={{
                        maxWidth: '1200px',
                        margin: '0 auto',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        gap: 'var(--space-md)'
                    }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-md)' }}>
                            <div style={{
                                width: '48px',
                                height: '48px',
                                background: 'linear-gradient(135deg, var(--accent) 0%, #1d4ed8 100%)',
                                borderRadius: 'var(--radius-md)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                fontSize: '24px'
                            }}>
                                🏥
                            </div>
                            <div>
                                <h1 style={{
                                    fontFamily: 'var(--font-display)',
                                    fontSize: '1.25rem',
                                    fontWeight: 700,
                                    letterSpacing: '-0.02em',
                                    margin: 0
                                }}>
                                    AI TRIAGE AGENT
                                </h1>
                                <p style={{
                                    fontSize: '0.75rem',
                                    color: 'var(--slate-400)',
                                    fontFamily: 'var(--font-display)',
                                    letterSpacing: '0.05em',
                                    margin: 0
                                }}>
                                    EMERGENCY SEVERITY INDEX v2.0
                                </p>
                            </div>
                        </div>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: 'var(--space-sm)',
                            background: 'rgba(255,255,255,0.1)',
                            padding: 'var(--space-xs) var(--space-sm)',
                            borderRadius: 'var(--radius-sm)',
                            fontSize: '0.75rem',
                            fontFamily: 'var(--font-display)'
                        }}>
                            <span style={{
                                width: '8px',
                                height: '8px',
                                background: 'var(--success)',
                                borderRadius: '50%',
                                animation: 'pulse 2s infinite'
                            }}></span>
                            SYSTEM ONLINE
                        </div>
                    </div>
                </header>
            );
        }

        // Vitals Input Component
        function VitalsInput({ vitals, setVitals, expanded, setExpanded }) {
            const vitalFields = [
                { key: 'hr', label: 'Heart Rate', unit: 'bpm', placeholder: '60-100', icon: '💓' },
                { key: 'bp_sys', label: 'BP Systolic', unit: 'mmHg', placeholder: '120', icon: '🩸' },
                { key: 'bp_dia', label: 'BP Diastolic', unit: 'mmHg', placeholder: '80', icon: '🩸' },
                { key: 'spo2', label: 'SpO2', unit: '%', placeholder: '95-100', icon: '🫁' },
                { key: 'temp', label: 'Temperature', unit: '°C', placeholder: '36.5', icon: '🌡️' },
                { key: 'rr', label: 'Resp. Rate', unit: '/min', placeholder: '12-20', icon: '💨' }
            ];

            return (
                <div style={{
                    background: 'white',
                    borderRadius: 'var(--radius-lg)',
                    border: '1px solid var(--slate-200)',
                    overflow: 'hidden',
                    transition: 'all 0.3s ease'
                }}>
                    <button
                        onClick={() => setExpanded(!expanded)}
                        style={{
                            width: '100%',
                            padding: 'var(--space-md) var(--space-lg)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'space-between',
                            background: 'var(--slate-50)',
                            border: 'none',
                            cursor: 'pointer',
                            fontFamily: 'var(--font-body)',
                            fontSize: '0.875rem',
                            fontWeight: 500,
                            color: 'var(--slate-700)',
                            transition: 'all 0.2s ease'
                        }}
                    >
                        <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-sm)' }}>
                            <span style={{ fontSize: '1.25rem' }}>📊</span>
                            Vital Signs (Optional)
                        </span>
                        <span style={{
                            transform: expanded ? 'rotate(180deg)' : 'rotate(0deg)',
                            transition: 'transform 0.3s ease',
                            fontSize: '1.25rem'
                        }}>
                            ▾
                        </span>
                    </button>

                    {expanded && (
                        <div style={{
                            padding: 'var(--space-lg)',
                            display: 'grid',
                            gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))',
                            gap: 'var(--space-md)',
                            animation: 'fadeIn 0.3s ease-out'
                        }}>
                            {vitalFields.map(field => (
                                <div key={field.key}>
                                    <label style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 'var(--space-xs)',
                                        fontSize: '0.75rem',
                                        fontWeight: 500,
                                        color: 'var(--slate-600)',
                                        marginBottom: 'var(--space-xs)'
                                    }}>
                                        <span>{field.icon}</span>
                                        {field.label}
                                    </label>
                                    <div style={{ position: 'relative' }}>
                                        <input
                                            type="number"
                                            value={vitals[field.key] || ''}
                                            onChange={(e) => setVitals({...vitals, [field.key]: e.target.value})}
                                            placeholder={field.placeholder}
                                            style={{
                                                width: '100%',
                                                padding: 'var(--space-sm) var(--space-md)',
                                                paddingRight: '45px',
                                                border: '1px solid var(--slate-200)',
                                                borderRadius: 'var(--radius-sm)',
                                                fontSize: '0.875rem',
                                                fontFamily: 'var(--font-display)',
                                                transition: 'all 0.2s ease',
                                                outline: 'none'
                                            }}
                                            onFocus={(e) => e.target.style.borderColor = 'var(--accent)'}
                                            onBlur={(e) => e.target.style.borderColor = 'var(--slate-200)'}
                                        />
                                        <span style={{
                                            position: 'absolute',
                                            right: 'var(--space-sm)',
                                            top: '50%',
                                            transform: 'translateY(-50%)',
                                            fontSize: '0.7rem',
                                            color: 'var(--slate-400)',
                                            fontFamily: 'var(--font-display)'
                                        }}>
                                            {field.unit}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ESI Display Component
        function ESIDisplay({ level, assessment }) {
            if (!level) return null;

            const config = ESI_CONFIG[level] || ESI_CONFIG[3];

            return (
                <div
                    className="animate-fade-in"
                    style={{
                        background: config.bg,
                        border: `2px solid ${config.color}`,
                        borderRadius: 'var(--radius-xl)',
                        padding: 'var(--space-xl)',
                        position: 'relative',
                        overflow: 'hidden'
                    }}
                >
                    {/* Glow effect */}
                    <div style={{
                        position: 'absolute',
                        top: '-50%',
                        right: '-20%',
                        width: '300px',
                        height: '300px',
                        background: `radial-gradient(circle, ${config.glow} 0%, transparent 70%)`,
                        pointerEvents: 'none'
                    }} />

                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: 'var(--space-xl)',
                        position: 'relative',
                        zIndex: 1
                    }}>
                        {/* ESI Number */}
                        <div style={{
                            width: '100px',
                            height: '100px',
                            background: config.color,
                            borderRadius: '50%',
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            justifyContent: 'center',
                            color: 'white',
                            boxShadow: `0 0 30px ${config.glow}`,
                            flexShrink: 0
                        }}>
                            <span style={{
                                fontFamily: 'var(--font-display)',
                                fontSize: '0.6rem',
                                letterSpacing: '0.1em',
                                opacity: 0.9
                            }}>ESI</span>
                            <span style={{
                                fontFamily: 'var(--font-display)',
                                fontSize: '2.5rem',
                                fontWeight: 700,
                                lineHeight: 1
                            }}>{level}</span>
                        </div>

                        {/* ESI Details */}
                        <div style={{ flex: 1 }}>
                            <h3 style={{
                                fontFamily: 'var(--font-display)',
                                fontSize: '1.5rem',
                                fontWeight: 700,
                                color: config.color,
                                marginBottom: 'var(--space-xs)'
                            }}>
                                {config.label}
                            </h3>
                            <p style={{
                                color: 'var(--slate-600)',
                                fontSize: '0.875rem',
                                marginBottom: 'var(--space-sm)'
                            }}>
                                {config.description}
                            </p>
                            {assessment?.decision_point && (
                                <span style={{
                                    display: 'inline-block',
                                    background: 'white',
                                    padding: 'var(--space-xs) var(--space-sm)',
                                    borderRadius: 'var(--radius-sm)',
                                    fontSize: '0.75rem',
                                    fontFamily: 'var(--font-display)',
                                    color: 'var(--slate-600)'
                                }}>
                                    Decision Point {assessment.decision_point}
                                </span>
                            )}
                        </div>

                        {/* ESI Scale */}
                        <div style={{
                            display: 'flex',
                            gap: '4px',
                            flexDirection: 'column'
                        }}>
                            {[1, 2, 3, 4, 5].map(n => (
                                <div
                                    key={n}
                                    style={{
                                        width: '12px',
                                        height: '12px',
                                        borderRadius: '2px',
                                        background: n === level ? ESI_CONFIG[n].color : 'var(--slate-200)',
                                        transition: 'all 0.3s ease',
                                        transform: n === level ? 'scale(1.3)' : 'scale(1)'
                                    }}
                                    title={`ESI ${n}`}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // Red Flags Component
        function RedFlags({ flags }) {
            if (!flags || flags.length === 0) return null;

            return (
                <div
                    className="animate-slide-in"
                    style={{
                        background: 'linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%)',
                        border: '1px solid var(--danger)',
                        borderLeft: '4px solid var(--danger)',
                        borderRadius: 'var(--radius-md)',
                        padding: 'var(--space-lg)',
                        position: 'relative',
                        overflow: 'hidden'
                    }}
                >
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: 'var(--space-sm)',
                        marginBottom: 'var(--space-md)'
                    }}>
                        <span style={{ fontSize: '1.5rem' }}>🚨</span>
                        <h4 style={{
                            fontFamily: 'var(--font-display)',
                            fontSize: '0.875rem',
                            fontWeight: 700,
                            color: 'var(--danger)',
                            letterSpacing: '0.05em',
                            textTransform: 'uppercase'
                        }}>
                            Red Flags Detected
                        </h4>
                    </div>
                    <ul style={{
                        listStyle: 'none',
                        display: 'flex',
                        flexDirection: 'column',
                        gap: 'var(--space-sm)'
                    }}>
                        {flags.map((flag, i) => (
                            <li
                                key={i}
                                style={{
                                    display: 'flex',
                                    alignItems: 'flex-start',
                                    gap: 'var(--space-sm)',
                                    fontSize: '0.875rem',
                                    color: 'var(--slate-700)'
                                }}
                            >
                                <span style={{ color: 'var(--danger)' }}>▸</span>
                                {flag}
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        // Department Routing Component
        function DepartmentRouting({ department, urgency }) {
            if (!department) return null;

            const urgencyColors = {
                'ER': { bg: '#fef2f2', color: '#dc2626', icon: '🚑' },
                'Urgent': { bg: '#fff7ed', color: '#ea580c', icon: '⚡' },
                'Routine': { bg: '#f0fdf4', color: '#16a34a', icon: '📋' }
            };

            const urgencyConfig = urgencyColors[urgency] || urgencyColors['Routine'];

            return (
                <div
                    className="animate-fade-in"
                    style={{
                        background: 'white',
                        borderRadius: 'var(--radius-lg)',
                        border: '1px solid var(--slate-200)',
                        padding: 'var(--space-lg)',
                        display: 'grid',
                        gridTemplateColumns: '1fr 1fr',
                        gap: 'var(--space-lg)'
                    }}
                >
                    <div>
                        <label style={{
                            fontSize: '0.75rem',
                            fontWeight: 500,
                            color: 'var(--slate-500)',
                            textTransform: 'uppercase',
                            letterSpacing: '0.05em',
                            display: 'block',
                            marginBottom: 'var(--space-sm)'
                        }}>
                            Suggested Department
                        </label>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: 'var(--space-sm)'
                        }}>
                            <span style={{ fontSize: '1.5rem' }}>🏥</span>
                            <span style={{
                                fontFamily: 'var(--font-display)',
                                fontSize: '1.25rem',
                                fontWeight: 700,
                                color: 'var(--slate-900)'
                            }}>
                                {department}
                            </span>
                        </div>
                    </div>

                    <div>
                        <label style={{
                            fontSize: '0.75rem',
                            fontWeight: 500,
                            color: 'var(--slate-500)',
                            textTransform: 'uppercase',
                            letterSpacing: '0.05em',
                            display: 'block',
                            marginBottom: 'var(--space-sm)'
                        }}>
                            Urgency Level
                        </label>
                        <div style={{
                            display: 'inline-flex',
                            alignItems: 'center',
                            gap: 'var(--space-sm)',
                            background: urgencyConfig.bg,
                            color: urgencyConfig.color,
                            padding: 'var(--space-sm) var(--space-md)',
                            borderRadius: 'var(--radius-md)',
                            fontFamily: 'var(--font-display)',
                            fontWeight: 700
                        }}>
                            <span>{urgencyConfig.icon}</span>
                            {urgency}
                        </div>
                    </div>
                </div>
            );
        }

        // Conditions Component
        function Conditions({ conditions, rationale }) {
            if (!conditions || conditions.length === 0) return null;

            return (
                <div
                    className="animate-fade-in"
                    style={{
                        background: 'white',
                        borderRadius: 'var(--radius-lg)',
                        border: '1px solid var(--slate-200)',
                        padding: 'var(--space-lg)'
                    }}
                >
                    <h4 style={{
                        fontSize: '0.75rem',
                        fontWeight: 500,
                        color: 'var(--slate-500)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em',
                        marginBottom: 'var(--space-md)'
                    }}>
                        Possible Conditions
                    </h4>
                    <div style={{
                        display: 'flex',
                        flexWrap: 'wrap',
                        gap: 'var(--space-sm)',
                        marginBottom: 'var(--space-lg)'
                    }}>
                        {conditions.map((cond, i) => (
                            <span
                                key={i}
                                style={{
                                    background: 'var(--slate-100)',
                                    padding: 'var(--space-xs) var(--space-md)',
                                    borderRadius: 'var(--radius-sm)',
                                    fontSize: '0.875rem',
                                    fontWeight: 500,
                                    color: 'var(--slate-700)'
                                }}
                            >
                                {cond.condition || cond}
                            </span>
                        ))}
                    </div>

                    {rationale && (
                        <div style={{
                            background: 'var(--slate-50)',
                            borderRadius: 'var(--radius-md)',
                            padding: 'var(--space-md)',
                            borderLeft: '3px solid var(--accent)'
                        }}>
                            <label style={{
                                fontSize: '0.7rem',
                                fontWeight: 500,
                                color: 'var(--slate-500)',
                                textTransform: 'uppercase',
                                letterSpacing: '0.05em',
                                display: 'block',
                                marginBottom: 'var(--space-xs)'
                            }}>
                                Clinical Rationale
                            </label>
                            <p style={{
                                fontSize: '0.875rem',
                                color: 'var(--slate-700)',
                                lineHeight: 1.6
                            }}>
                                {rationale}
                            </p>
                        </div>
                    )}
                </div>
            );
        }

        // Clarification Questions Component
        function ClarificationQuestions({ questions, onSubmit, onSkip }) {
            const [answers, setAnswers] = useState({});

            if (!questions || questions.length === 0) return null;

            return (
                <div
                    className="animate-fade-in"
                    style={{
                        background: 'linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%)',
                        border: '2px solid var(--accent)',
                        borderRadius: 'var(--radius-xl)',
                        padding: 'var(--space-xl)',
                        position: 'relative'
                    }}
                >
                    <div style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: 'var(--space-sm)',
                        marginBottom: 'var(--space-lg)'
                    }}>
                        <span style={{ fontSize: '1.5rem' }}>💬</span>
                        <h4 style={{
                            fontFamily: 'var(--font-display)',
                            fontSize: '1rem',
                            fontWeight: 700,
                            color: 'var(--slate-900)'
                        }}>
                            Additional Questions
                        </h4>
                    </div>
                    <p style={{
                        fontSize: '0.875rem',
                        color: 'var(--slate-600)',
                        marginBottom: 'var(--space-lg)'
                    }}>
                        Please answer these questions to help us better assess your condition:
                    </p>

                    <div style={{
                        display: 'flex',
                        flexDirection: 'column',
                        gap: 'var(--space-lg)'
                    }}>
                        {questions.map((q, i) => (
                            <div key={i}>
                                <p style={{
                                    fontWeight: 500,
                                    color: 'var(--slate-800)',
                                    marginBottom: 'var(--space-sm)'
                                }}>
                                    {i + 1}. {q}
                                </p>
                                <div style={{
                                    display: 'flex',
                                    gap: 'var(--space-sm)'
                                }}>
                                    {['Yes', 'No', 'Not Sure'].map(opt => (
                                        <button
                                            key={opt}
                                            onClick={() => setAnswers({...answers, [i]: opt})}
                                            style={{
                                                padding: 'var(--space-sm) var(--space-lg)',
                                                border: answers[i] === opt ? '2px solid var(--accent)' : '1px solid var(--slate-300)',
                                                borderRadius: 'var(--radius-md)',
                                                background: answers[i] === opt ? 'white' : 'rgba(255,255,255,0.5)',
                                                cursor: 'pointer',
                                                fontSize: '0.875rem',
                                                fontWeight: answers[i] === opt ? 600 : 400,
                                                color: answers[i] === opt ? 'var(--accent)' : 'var(--slate-600)',
                                                transition: 'all 0.2s ease'
                                            }}
                                        >
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div style={{
                        display: 'flex',
                        gap: 'var(--space-md)',
                        marginTop: 'var(--space-xl)',
                        justifyContent: 'flex-end'
                    }}>
                        <button
                            onClick={onSkip}
                            style={{
                                padding: 'var(--space-sm) var(--space-lg)',
                                border: '1px solid var(--slate-300)',
                                borderRadius: 'var(--radius-md)',
                                background: 'white',
                                cursor: 'pointer',
                                fontSize: '0.875rem',
                                color: 'var(--slate-600)'
                            }}
                        >
                            Skip
                        </button>
                        <button
                            onClick={() => onSubmit(answers)}
                            style={{
                                padding: 'var(--space-sm) var(--space-xl)',
                                border: 'none',
                                borderRadius: 'var(--radius-md)',
                                background: 'var(--accent)',
                                cursor: 'pointer',
                                fontSize: '0.875rem',
                                fontWeight: 600,
                                color: 'white'
                            }}
                        >
                            Submit Answers
                        </button>
                    </div>
                </div>
            );
        }

        // Loading Spinner
        function LoadingSpinner() {
            return (
                <div style={{
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: 'var(--space-3xl)',
                    gap: 'var(--space-lg)'
                }}>
                    <div style={{
                        width: '60px',
                        height: '60px',
                        border: '4px solid var(--slate-200)',
                        borderTopColor: 'var(--accent)',
                        borderRadius: '50%',
                        animation: 'spin 1s linear infinite'
                    }} />
                    <div style={{ textAlign: 'center' }}>
                        <p style={{
                            fontFamily: 'var(--font-display)',
                            fontSize: '0.875rem',
                            color: 'var(--slate-600)',
                            animation: 'pulse 1.5s infinite'
                        }}>
                            Analyzing symptoms...
                        </p>
                        <p style={{
                            fontSize: '0.75rem',
                            color: 'var(--slate-400)',
                            marginTop: 'var(--space-xs)'
                        }}>
                            Running ESI assessment & clinical reasoning
                        </p>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [symptoms, setSymptoms] = useState('');
            const [vitals, setVitals] = useState({});
            const [vitalsExpanded, setVitalsExpanded] = useState(false);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const textareaRef = useRef(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!symptoms.trim()) return;

                setLoading(true);
                setError(null);
                setResult(null);

                try {
                    // Prepare vitals if any
                    const vitalsData = Object.keys(vitals).length > 0 ? {
                        hr: vitals.hr ? parseInt(vitals.hr) : null,
                        bp: vitals.bp_sys && vitals.bp_dia ? `${vitals.bp_sys}/${vitals.bp_dia}` : null,
                        spo2: vitals.spo2 ? parseInt(vitals.spo2) : null,
                        temp: vitals.temp ? parseFloat(vitals.temp) : null,
                        rr: vitals.rr ? parseInt(vitals.rr) : null
                    } : null;

                    const response = await fetch(`${API_BASE}/triage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: symptoms,
                            lang: 'en',
                            vitals: vitalsData
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    setResult(data);
                } catch (err) {
                    console.error('Triage error:', err);
                    setError(err.message);

                    // Demo mode - show sample result
                    setResult({
                        esi_level: 3,
                        esi_assessment: {
                            level: 3,
                            decision_point: 'C',
                            rationale: 'Requires 2+ medical resources for evaluation',
                            confidence: 0.85
                        },
                        final_output: {
                            suggested_department: 'Urgent Care',
                            urgency: 'Urgent',
                            esi_level: 3,
                            confidence: 0.85,
                            rationale: 'Based on symptom analysis, patient requires urgent evaluation. ESI Level: 3',
                            final_conditions: [
                                { condition: 'Requires clinical evaluation', confidence: 0.85 }
                            ],
                            red_flags: []
                        },
                        _demo: true
                    });
                } finally {
                    setLoading(false);
                }
            };

            const handleClarificationSubmit = (answers) => {
                console.log('Clarification answers:', answers);
                // In real app, would re-submit with answers
            };

            const handleClarificationSkip = () => {
                if (result) {
                    setResult({...result, clarification_questions: null});
                }
            };

            const sampleCases = [
                "I have severe chest pain that started 30 minutes ago. It feels like pressure and radiates to my left arm. I'm also having difficulty breathing.",
                "I have a mild headache that started this morning. It's not too bad, maybe 3 out of 10.",
                "I have stomach pain for 2 days around my belly button. Pain is 5 out of 10. I feel nauseous."
            ];

            return (
                <div style={{ minHeight: '100vh' }}>
                    <Header />

                    <main style={{
                        maxWidth: '900px',
                        margin: '0 auto',
                        padding: 'var(--space-xl)'
                    }}>
                        {/* Input Section */}
                        <section style={{
                            marginBottom: 'var(--space-2xl)'
                        }}>
                            <form onSubmit={handleSubmit}>
                                <div style={{
                                    background: 'white',
                                    borderRadius: 'var(--radius-xl)',
                                    border: '1px solid var(--slate-200)',
                                    padding: 'var(--space-xl)',
                                    boxShadow: 'var(--shadow-lg)',
                                    marginBottom: 'var(--space-lg)'
                                }}>
                                    <label style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: 'var(--space-sm)',
                                        fontSize: '0.875rem',
                                        fontWeight: 600,
                                        color: 'var(--slate-700)',
                                        marginBottom: 'var(--space-md)'
                                    }}>
                                        <span style={{ fontSize: '1.25rem' }}>🩺</span>
                                        Describe Your Symptoms
                                    </label>

                                    <textarea
                                        ref={textareaRef}
                                        value={symptoms}
                                        onChange={(e) => setSymptoms(e.target.value)}
                                        placeholder="Please describe your symptoms in detail. Include information about: when it started, severity (1-10), location, and any other relevant details..."
                                        style={{
                                            width: '100%',
                                            minHeight: '140px',
                                            padding: 'var(--space-lg)',
                                            border: '2px solid var(--slate-200)',
                                            borderRadius: 'var(--radius-md)',
                                            fontSize: '1rem',
                                            fontFamily: 'var(--font-body)',
                                            resize: 'vertical',
                                            outline: 'none',
                                            transition: 'border-color 0.2s ease',
                                            lineHeight: 1.6
                                        }}
                                        onFocus={(e) => e.target.style.borderColor = 'var(--accent)'}
                                        onBlur={(e) => e.target.style.borderColor = 'var(--slate-200)'}
                                    />

                                    {/* Quick samples */}
                                    <div style={{
                                        marginTop: 'var(--space-md)',
                                        display: 'flex',
                                        flexWrap: 'wrap',
                                        gap: 'var(--space-sm)'
                                    }}>
                                        <span style={{
                                            fontSize: '0.75rem',
                                            color: 'var(--slate-500)'
                                        }}>Try:</span>
                                        {['Chest pain', 'Headache', 'Abdominal pain'].map((sample, i) => (
                                            <button
                                                key={i}
                                                type="button"
                                                onClick={() => setSymptoms(sampleCases[i])}
                                                style={{
                                                    padding: 'var(--space-xs) var(--space-sm)',
                                                    background: 'var(--slate-100)',
                                                    border: 'none',
                                                    borderRadius: 'var(--radius-sm)',
                                                    fontSize: '0.75rem',
                                                    color: 'var(--slate-600)',
                                                    cursor: 'pointer',
                                                    transition: 'all 0.2s ease'
                                                }}
                                                onMouseOver={(e) => e.target.style.background = 'var(--slate-200)'}
                                                onMouseOut={(e) => e.target.style.background = 'var(--slate-100)'}
                                            >
                                                {sample}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Vitals */}
                                <VitalsInput
                                    vitals={vitals}
                                    setVitals={setVitals}
                                    expanded={vitalsExpanded}
                                    setExpanded={setVitalsExpanded}
                                />

                                {/* Submit Button */}
                                <button
                                    type="submit"
                                    disabled={loading || !symptoms.trim()}
                                    style={{
                                        width: '100%',
                                        marginTop: 'var(--space-lg)',
                                        padding: 'var(--space-lg)',
                                        background: loading || !symptoms.trim()
                                            ? 'var(--slate-300)'
                                            : 'linear-gradient(135deg, var(--slate-900) 0%, var(--slate-700) 100%)',
                                        border: 'none',
                                        borderRadius: 'var(--radius-lg)',
                                        color: 'white',
                                        fontSize: '1rem',
                                        fontWeight: 600,
                                        fontFamily: 'var(--font-body)',
                                        cursor: loading || !symptoms.trim() ? 'not-allowed' : 'pointer',
                                        transition: 'all 0.3s ease',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: 'var(--space-sm)',
                                        boxShadow: loading || !symptoms.trim() ? 'none' : 'var(--shadow-lg)'
                                    }}
                                >
                                    {loading ? (
                                        <>
                                            <span style={{
                                                width: '20px',
                                                height: '20px',
                                                border: '2px solid rgba(255,255,255,0.3)',
                                                borderTopColor: 'white',
                                                borderRadius: '50%',
                                                animation: 'spin 1s linear infinite'
                                            }} />
                                            Processing...
                                        </>
                                    ) : (
                                        <>
                                            <span>🔍</span>
                                            Run Triage Assessment
                                        </>
                                    )}
                                </button>
                            </form>
                        </section>

                        {/* Loading State */}
                        {loading && <LoadingSpinner />}

                        {/* Results Section */}
                        {result && !loading && (
                            <section className="stagger-children" style={{
                                display: 'flex',
                                flexDirection: 'column',
                                gap: 'var(--space-lg)'
                            }}>
                                {result._demo && (
                                    <div style={{
                                        background: 'var(--warning)',
                                        color: 'white',
                                        padding: 'var(--space-sm) var(--space-md)',
                                        borderRadius: 'var(--radius-sm)',
                                        fontSize: '0.75rem',
                                        fontFamily: 'var(--font-display)',
                                        textAlign: 'center'
                                    }}>
                                        ⚠️ DEMO MODE - API unavailable, showing sample response
                                    </div>
                                )}

                                {/* ESI Level */}
                                <ESIDisplay
                                    level={result.final_output?.esi_level || result.esi_level}
                                    assessment={result.esi_assessment}
                                />

                                {/* Red Flags */}
                                <RedFlags flags={result.final_output?.red_flags || result.red_flags} />

                                {/* Clarification Questions */}
                                {result.clarification_questions && result.clarification_questions.length > 0 && (
                                    <ClarificationQuestions
                                        questions={result.clarification_questions}
                                        onSubmit={handleClarificationSubmit}
                                        onSkip={handleClarificationSkip}
                                    />
                                )}

                                {/* Department Routing */}
                                <DepartmentRouting
                                    department={result.final_output?.suggested_department}
                                    urgency={result.final_output?.urgency}
                                />

                                {/* Conditions */}
                                <Conditions
                                    conditions={result.final_output?.final_conditions}
                                    rationale={result.final_output?.rationale}
                                />
                            </section>
                        )}

                        {/* Error State */}
                        {error && !result && (
                            <div style={{
                                background: 'var(--esi-1-bg)',
                                border: '1px solid var(--danger)',
                                borderRadius: 'var(--radius-md)',
                                padding: 'var(--space-lg)',
                                textAlign: 'center'
                            }}>
                                <p style={{ color: 'var(--danger)', fontWeight: 500 }}>
                                    ⚠️ {error}
                                </p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer style={{
                        borderTop: '1px solid var(--slate-200)',
                        padding: 'var(--space-xl)',
                        textAlign: 'center',
                        color: 'var(--slate-500)',
                        fontSize: '0.75rem',
                        fontFamily: 'var(--font-display)',
                        marginTop: 'var(--space-3xl)'
                    }}>
                        <p>AI Triage Agent v2.0 | ESI Assessment System</p>
                        <p style={{ marginTop: 'var(--space-xs)', color: 'var(--slate-400)' }}>
                            For demonstration purposes only. Always seek professional medical advice.
                        </p>
                    </footer>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
